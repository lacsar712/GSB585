server:
  port: 8000

spring:
  application:
    name: city-courier-backend
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/city_courier.db
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    time-zone: Asia/Shanghai

logging:
  level:
    root: INFO
    com.citycourier: INFO

security:
  jwt:
    secret: ${JWT_SECRET}
    expire-seconds: 7200
